<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/home/shareObj.css">
    <link rel="stylesheet" href="/static/home/index.css">
    <link rel="stylesheet" href="/static/dialog/dialog.css">
    <script defer src="/static/home/setWebData.js"></script>
    <script defer src="/static/dialog/dialog.js"></script>
    <title>Index</title>
  </head>
  <body>
    <nav class="Nav Nav-height">
      <div class="Nav-content">
        <div class="Nav-title">台北一日遊</div>
        <div class="Nav Nav-btn">
          <button class="btn-appearance">預定行程</button>
          <button class="btn-sign" id="member_btn">登入/註冊</button>
        </div>
      </div>
    </nav>
    <!-- nav下來的圖片 -->
    <section class="Sec">
      <img class="Sec-img" src="/static/img/welcome.png">
    </section>

    <div class="Sec-search">
      <div class="Sec-engine">
        <div class="search-text">
          <div>
            <span class=" search-big">輕鬆享受台北一日悠閒</span>
          </div>
          <div class="search-secStr">
            <span class="search-small">探索每個角落，體驗城市的深度旅遊行程</span>
          </div>
        </div>
        <div class="search-dt">
          <div class="dt-select">
            <button type="button" class="select-text" id="selectCategory">
              <span id="categoryName">全部分類</span>
              <img class="text-triangle" src="/static/img/triangle.png">
            </button>
            <div class="dt-droplist" id="dropItem">
              <ul class="dt-option"  id="searchDropList">
                <!-- <li class="option">全部分類</li>
                -->
              </ul>
            </div>
          </div>
          <div class="search-input">
            <input type="text" class="search-input searchStr" id="searInpt" value="輸入景點名稱查詢">
          </div>
          <div class="search-btn">
            <button type="button" class="search-btn-icon" id="searBtn"><img src="/static/img/icon_search.png"></button>
          </div>
        </div>
      </div>
    </div>

    <div class="webConent">
      <div class="webConent-center">
        <div class="center-bar">
          <!-- list bar 可以左右滑動的功能 -->
          <div class="listBar">
            <button class="leftBtn" id="barLeftBtn"><img src="/static/img/left_Default.png"></button>
            <div class="mrt-item" id="mrtItemScorll">
              <ul class="mrt-container" id="mrtCTN">
                <!-- <li class="mrt-option">劍潭</li>
                -->
              </ul>
            </div>
            <button class="rightBtn" id="barRightBtn"><img src="/static/img/right_Default.png"></button>
          </div>
        </div>

        <!-- 顯示景點圖片與一些資訊 -->
        <div class="center-img">
          <div class="img-fw" id="imgFW">
            <div class="img-content" id="imgCTN">

            </div> 
          </div>
        </div>
      </div>
    </div>

    <footer id="footerBlock">
      <div>COPYRIGHT © 2021 台北一日遊</div>
    </footer>

    <dialog class="logsign_dialog">
      <div class="dialog_hair"></div>
      <div class="dialog_operaction">
        <div class="dialog_sec">
          <div></div>
          <div class="sec_title">登入會員帳號</div>
          <button type="button" class="sec_btn">
            <img src="/static/img/icon_close.png">
          </button>
        </div>
        <div class="dialog_third">
          <div class="third_operationPart opt1">
            <input type="text" class="operationPart_name" id="nameStr" placeholder="輸入姓名">
          </div>
          <div class="third_operationPart opt2">
            <input type="email" class="operationPart_email" id="emailStr" placeholder="輸入電子信箱">
          </div>
          <div class="third_operationPart opt3">
            <input type="password" class="operationPart_pw" id="pwStr" placeholder="輸入密碼">
          </div>
          <div class="third_operationPart signin_btn">
            <button type="button">註冊新帳戶</button>
          </div>
          <div class="third_operationPart login_btn">
            <button type="button">登入帳戶</button>
          </div>
          <div class="dialog_error">電子信箱發生重複的錯誤</div>
          <div class="dialog_remind_signin">
            <span>已經有帳戶了？</span>
            <span class="signin_loginBtn">點此登入</span>
          </div>
          <div class="dialog_remind_login">
            <span>還沒有帳戶？</span>
            <span class="login_signinBtn">點此註冊</span>
          </div>
        </div>
      </div>
    </dialog>
  </body>
</html>
